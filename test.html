<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Tests — Strava Sports Viz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; background: #f5f5f5; color: #222; }
    h2 { margin-bottom: 16px; }
    h3 { margin: 18px 0 6px; padding: 6px 0; border-bottom: 1px solid #ddd; color: #444; }
    .summary { color: #fff; padding: 12px 16px; border-radius: 6px; font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .pass { padding: 3px 8px; color: #2e7d32; }
    .fail { padding: 3px 8px; color: #c62828; background: #ffebee; border-radius: 4px; margin: 2px 0; }
    .err { font-size: 12px; color: #888; margin-left: 12px; }
    #results { max-width: 800px; }
  </style>
</head>
<body>
  <h2>Unit Tests</h2>
  <div id="results">Running...</div>

  <!-- Define _test namespace BEFORE loading app scripts -->
  <script>window._test = {};</script>

  <!-- App scripts (load order matches strava-viz.html) -->
  <script src="js/utils.js"></script>
  <script src="js/strava-api.js"></script>
  <script src="js/charts-breakdown.js"></script>
  <script src="js/charts-character.js"></script>
  <script src="js/charts-records.js"></script>

  <!-- Test infrastructure + suite -->
  <script src="js/test-runner.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
